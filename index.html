<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sprite Tracker</title>
    <style>
      :root {
        color-scheme: light;
        --paper: oklch(96% 0.018 78);
        --panel: oklch(99% 0.012 86);
        --panel-2: oklch(93% 0.02 92);
        --ink: oklch(22% 0.035 268);
        --muted: oklch(48% 0.028 263);
        --line: oklch(78% 0.035 78);
        --collected: oklch(67% 0.17 155);
        --mastered: oklch(62% 0.18 302);
        --accent: oklch(64% 0.19 35);
        --focus: oklch(62% 0.18 225);
        --shadow: 0 18px 46px oklch(28% 0.04 55 / 0.16);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 12% 16%, oklch(88% 0.13 197 / 0.58), transparent 27rem),
          radial-gradient(circle at 92% 5%, oklch(83% 0.15 38 / 0.45), transparent 24rem),
          linear-gradient(145deg, oklch(98% 0.02 89), var(--paper) 48%, oklch(93% 0.035 103));
        color: var(--ink);
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(15rem, 19rem) minmax(0, 1fr);
        gap: 0.8rem;
        min-height: 100vh;
        padding: 0.8rem;
        transition: grid-template-columns 180ms ease-out;
      }

      body.side-collapsed .shell {
        grid-template-columns: 0 minmax(0, 1fr);
      }

      .side,
      .main {
        min-width: 0;
      }

      .side {
        position: sticky;
        top: 1rem;
        align-self: start;
        display: grid;
        gap: 0.75rem;
        max-height: calc(100vh - 2rem);
        overflow: auto;
        transition: opacity 150ms ease-out, visibility 150ms ease-out;
      }

      body.side-collapsed .side {
        opacity: 0;
        visibility: hidden;
        overflow: hidden;
      }

      .masthead {
        padding: 1rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      h1 {
        margin: 0;
        font-size: 1.85rem;
        line-height: 1.05;
        letter-spacing: 0;
      }

      .subhead {
        margin: 0.45rem 0 0;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.35;
      }

      .toolbar-progress {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.45rem;
      }

      .progress-pill {
        display: inline-flex;
        align-items: baseline;
        gap: 0.28rem;
        min-height: 2.35rem;
        padding: 0 0.7rem;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel-2);
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 800;
        white-space: nowrap;
      }

      .progress-pill strong {
        color: var(--ink);
        font-size: 0.98rem;
        line-height: 1;
      }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: grid;
        gap: 0.75rem;
        padding: 0.8rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: oklch(99% 0.012 86 / 0.94);
        box-shadow: 0 12px 30px oklch(28% 0.04 55 / 0.12);
      }

      .topline {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
      }

      .toolbar-left {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
      }

      .filters,
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
      }

      .chip,
      .tool {
        min-height: 2.35rem;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
        color: var(--ink);
        font-weight: 750;
        transition: transform 160ms ease-out, border-color 160ms ease-out, background 160ms ease-out;
      }

      .panel-control {
        display: flex;
        align-items: center;
        padding-right: 0.75rem;
        border-right: 1px solid var(--line);
      }

      .panel-toggle {
        display: grid;
        place-items: center;
        width: 2.35rem;
        min-height: 2.35rem;
        padding: 0;
        border: 1px solid oklch(58% 0.11 224);
        border-radius: 7px;
        background: oklch(92% 0.055 222);
        color: oklch(27% 0.06 242);
        transition: transform 160ms ease-out, border-color 160ms ease-out, background 160ms ease-out;
      }

      .menu-bars {
        display: grid;
        gap: 0.18rem;
        width: 1rem;
      }

      .menu-bars span {
        display: block;
        height: 2px;
        border-radius: 999px;
        background: currentColor;
      }

      .chip {
        padding: 0 0.8rem;
      }

      .tool {
        padding: 0 0.7rem;
      }

      .chip:hover,
      .panel-toggle:hover,
      .tool:hover {
        transform: translateY(-1px);
        border-color: oklch(64% 0.13 78);
      }

      .chip.active {
        border-color: var(--accent);
        background: oklch(91% 0.085 50);
      }

      .search {
        width: min(100%, 24rem);
        min-height: 2.45rem;
        padding: 0 0.8rem;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
        color: var(--ink);
      }

      .search:focus,
      .chip:focus-visible,
      .panel-toggle:focus-visible,
      .tool:focus-visible,
      .toggle:focus-visible,
      .sprite-card:focus-visible {
        outline: 3px solid oklch(62% 0.18 225 / 0.34);
        outline-offset: 2px;
      }

      .grid {
        display: grid;
        gap: 0.9rem;
        padding-top: 0.85rem;
      }

      .sprite-row {
        display: grid;
        gap: 0.55rem;
      }

      .sprite-row.hidden {
        display: none;
      }

      .row-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0 0.15rem;
      }

      .row-heading {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        min-width: 0;
      }

      .row-title h2 {
        margin: 0;
        font-size: 1rem;
        line-height: 1.2;
        letter-spacing: 0;
      }

      .row-count {
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 750;
      }

      .row-skill {
        max-width: 18rem;
        padding: 0.18rem 0.5rem;
        overflow: hidden;
        border: 1px solid oklch(76% 0.075 168);
        border-radius: 999px;
        background: oklch(94% 0.04 168);
        color: oklch(31% 0.07 172);
        font-size: 0.72rem;
        font-weight: 850;
        line-height: 1;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row-cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(9.25rem, 1fr));
        gap: 0.55rem;
      }

      .sprite-card {
        position: relative;
        isolation: isolate;
        display: grid;
        grid-template-rows: 4.8rem minmax(2.65rem, auto) auto;
        gap: 0.38rem;
        min-height: 9.4rem;
        overflow: hidden;
        padding: 0.55rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 8px 18px oklch(28% 0.04 55 / 0.08);
        transition: transform 170ms ease-out, box-shadow 170ms ease-out, border-color 170ms ease-out;
      }

      .sprite-card:hover {
        transform: translateY(-2px);
        border-color: oklch(66% 0.12 78);
        box-shadow: 0 13px 24px oklch(28% 0.04 55 / 0.13);
      }

      .sprite-card.hidden {
        display: none;
      }

      .sprite-stage {
        position: relative;
        z-index: 0;
        display: grid;
        place-items: center;
        width: 100%;
        overflow: hidden;
        min-height: 0;
        border-radius: 7px;
        background:
          linear-gradient(145deg, oklch(98% 0.01 90), oklch(91% 0.03 100)),
          radial-gradient(circle at 50% 100%, oklch(73% 0.14 150 / 0.35), transparent 42%);
      }

      .sprite-image {
        display: block;
        width: min(4.7rem, 90%);
        height: min(4.5rem, 90%);
        object-fit: contain;
        pointer-events: none;
        filter: drop-shadow(0 0.35rem 0.45rem oklch(28% 0.04 55 / 0.22));
      }

      .meta {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 0.22rem 0.5rem;
        min-width: 0;
      }

      .name {
        min-width: 0;
        max-width: 100%;
        font-size: 0.88rem;
        font-weight: 800;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .number {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 800;
      }

      .variant-skill,
      .availability {
        grid-column: 1 / -1;
        min-width: 0;
        max-width: 100%;
        overflow: hidden;
        color: var(--muted);
        font-size: 0.7rem;
        font-weight: 750;
        line-height: 1.15;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .availability {
        justify-self: start;
        padding: 0.12rem 0.42rem;
        border: 1px solid oklch(78% 0.05 58);
        border-radius: 999px;
        background: oklch(94% 0.035 67);
        color: oklch(42% 0.07 55);
        text-transform: uppercase;
      }

      .toggles {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.45rem;
      }

      .toggle {
        min-width: 0;
        min-height: 1.95rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding: 0 0.35rem;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: oklch(96% 0.01 86);
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 850;
        text-transform: uppercase;
        transition: background 150ms ease-out, border-color 150ms ease-out, color 150ms ease-out;
      }

      .toggle[data-kind="collected"].on {
        border-color: oklch(57% 0.15 155);
        background: oklch(88% 0.12 152);
        color: oklch(28% 0.09 155);
      }

      .toggle[data-kind="mastered"].on {
        border-color: oklch(55% 0.15 302);
        background: oklch(89% 0.1 310);
        color: oklch(33% 0.1 302);
      }

      .drawer {
        display: grid;
        gap: 0.45rem;
        padding: 0.8rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .drawer textarea {
        min-height: 5.2rem;
        resize: vertical;
        padding: 0.65rem;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: oklch(97% 0.01 86);
        color: var(--ink);
      }

      .status {
        min-height: 1.3rem;
        color: var(--muted);
        font-size: 0.85rem;
      }

      @media (max-width: 880px) {
        .shell {
          grid-template-columns: 1fr;
        }

        body.side-collapsed .shell {
          grid-template-columns: 1fr;
        }

        .side {
          position: static;
          max-height: none;
        }

        body.side-collapsed .side {
          display: none;
        }

        .toolbar {
          top: 0.5rem;
        }

        .panel-control {
          padding-right: 0;
          border-right: 0;
        }
      }

      @media (max-width: 560px) {
        .shell {
          padding: 0.65rem;
        }

        .row-cards {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 0.55rem;
        }

        .sprite-card {
          grid-template-rows: 5.2rem auto auto;
          min-height: 10.4rem;
          padding: 0.55rem;
        }

        .sprite-image {
          width: min(5rem, 92%);
        }

        .topline {
          align-items: stretch;
        }

        .search {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="side">
        <section class="masthead" aria-labelledby="page-title">
          <h1 id="page-title">Sprite Tracker</h1>
          <p class="subhead">Fortnite Runners, <span id="spriteTotalLabel">61</span> sprite variants</p>
        </section>

        <section class="drawer" aria-label="Data">
          <div class="actions">
            <button class="tool" id="exportData" type="button">Export</button>
            <button class="tool" id="importData" type="button">Import</button>
            <button class="tool" id="resetData" type="button">Reset</button>
          </div>
          <textarea id="dataBox" spellcheck="false" aria-label="Tracker data"></textarea>
          <div class="status" id="status" role="status"></div>
        </section>
      </aside>

      <main class="main">
        <nav class="toolbar" aria-label="Tracker controls">
          <div class="topline">
            <div class="toolbar-left">
              <div class="panel-control">
                <button id="toggleSidebar" type="button" class="panel-toggle" aria-pressed="false" aria-label="Hide panel">
                  <span class="menu-bars" aria-hidden="true"><span></span><span></span><span></span></span>
                </button>
              </div>
              <div class="filters" aria-label="Filters">
                <button class="chip active" type="button" data-filter="all">All</button>
                <button class="chip" type="button" data-filter="missing">Missing</button>
                <button class="chip" type="button" data-filter="collected">Collected</button>
                <button class="chip" type="button" data-filter="mastered">Mastered</button>
                <button class="chip" type="button" data-filter="hide-mastered">Hide mastered</button>
                <button class="chip" id="toggleUnreleased" type="button" aria-pressed="false">Unreleased</button>
              </div>
              <div class="toolbar-progress" aria-label="Progress">
                <span class="progress-pill"><strong id="collectedCount">0/61</strong> Collected</span>
                <span class="progress-pill"><strong id="masteredCount">0/61</strong> Mastered</span>
              </div>
            </div>
            <input class="search" id="search" type="search" placeholder="Search" aria-label="Search sprites">
          </div>
        </nav>
        <section class="grid" id="spriteGrid" aria-label="Sprites"></section>
      </main>
    </div>

        { id: "v4110-gummy-air", name: "Gummy Air Sprite", image: "assets/sprites/v4110-gummy-air.webp", rarity: "special", dropRate: "0%", released: false, variant: "Gummy", variantSkill: "Gain 20% more Sprite Dust upon Extraction" },
        { id: "v4110-galaxy-air", name: "Galaxy Air Sprite", image: "assets/sprites/v4110-galaxy-air.webp", rarity: "special", dropRate: "0%", released: false, variant: "Galaxy", variantSkill: "Gain 30% more Ammunition when looting" },
        { id: "v4110-holofoil-air", name: "Holofoil Air Sprite", image: "assets/sprites/v4110-holofoil-air.webp", rarity: "special", dropRate: "0%", released: false, variant: "Holofoil", variantSkill: "5% squad chance to find rare Sprite variants from chests" },
        { id: "v4110-seven", name: "Seven Sprite", image: "assets/sprites/v4110-seven.webp", rarity: "legendary", dropRate: "0%", released: false, variant: "Base" },
        { id: "v4110-gold-seven", name: "Gold Seven Sprite", image: "assets/sprites/v4110-gold-seven.webp", rarity: "special", dropRate: "0%", released: false, variant: "Gold", variantSkill: "Gain 3x bonus XP from eliminations" },
        { id: "v4110-gummy-seven", name: "Gummy Seven Sprite", image: "assets/sprites/v4110-gummy-seven.webp", rarity: "special", dropRate: "0%", released: false, variant: "Gummy", variantSkill: "Gain 20% more Sprite Dust upon Extraction" },
        { id: "v4110-galaxy-seven", name: "Galaxy Seven Sprite", image: "assets/sprites/v4110-galaxy-seven.webp", rarity: "special", dropRate: "0%", released: false, variant: "Galaxy", variantSkill: "Gain 30% more Ammunition when looting" },
        { id: "v4110-holofoil-seven", name: "Holofoil Seven Sprite", image: "assets/sprites/v4110-holofoil-seven.webp", rarity: "special", dropRate: "0%", released: false, variant: "Holofoil", variantSkill: "5% squad chance to find rare Sprite variants from chests" },
      ];
      const SPRITE_TOTAL = spriteAssets.filter((sprite) => sprite.released).length;
      spriteTotalLabel.textContent = SPRITE_TOTAL;
      const variantPrefixes = ["Gold", "Gummy", "Galaxy", "Gem", "Holofoil"];
      const spriteSkills = {
        "Earth Sprite": "Rare chest boost",
        "Fire Sprite": "Fire burst on damage",
        "Water Sprite": "Shield regen in water",
        "Duck Sprite": "Emote shield regen",
        "Demon Sprite": "Heal on elim",
        "Ghost Sprite": "Reload invisibility",
        "King Sprite": "Pickaxe damage up",
        "Punk Sprite": "Random chest bonus",
        "Dream Sprite": "Loot each level",
        "Zero Point Sprite": "Heal bubble",
        "Burnt Peanut": "Extra elim loot",
        "Fishy Sprite": "Swim/move speed boost",
        "Striker Sprite": "Overdrive on mantle",
        "Aura Sprite": "Shock Rock charge",
      };
      const groupOrder = [
        "Water Sprite",
        "Earth Sprite",
        "Fire Sprite",
        "Duck Sprite",
        "Ghost Sprite",
        "Dream Sprite",
        "Demon Sprite",
        "Punk Sprite",
        "King Sprite",
        "Burnt Peanut",
        "Fishy Sprite",
        "Striker Sprite",
        "Aura Sprite",
        "Boss Sprite",
        "Grim Sprite",
        "Air Sprite",
        "Seven Sprite",
      ];
      const sprites = spriteAssets.map((sprite, index) => {
        const group = sprite.name.replace(new RegExp(`^(${variantPrefixes.join("|")})\\s+`), "");
        return {
          ...sprite,
          group,
          tag: sprite.id,
          previousId: sprite.id.startsWith("mat") ? String(Number(sprite.id.replace("mat", "")) + 1) : "",
          source: "Fortnite.GG",
          availability: sprite.released ? "released" : "unreleased",
          number: index + 1,
        };
      });
      const discoveredGroups = [...new Set(sprites.map((sprite) => sprite.group))];
      const groups = [
        ...groupOrder.filter((group) => discoveredGroups.includes(group)),
        ...discoveredGroups.filter((group) => !groupOrder.includes(group)),
      ];

      let state = loadState();

      function emptyState() {
        return sprites.reduce((next, sprite) => {
          next[sprite.id] = { collected: false, mastered: false };
          return next;
        }, {});
      }

      function normalizeState(raw) {
        const source = raw && typeof raw === "object" ? raw : {};
        const next = { ...source };
        for (const sprite of sprites) {
          const existing = source[sprite.id] || source[sprite.previousId] || {};
          const mastered = Boolean(existing.mastered);
          next[sprite.id] = {
            collected: Boolean(existing.collected) || mastered,
            mastered,
          };
        }
        return next;
      }

      function loadState() {
        try {
          return normalizeState(JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"));
        } catch {
          return emptyState();
        }
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        persistServerState();
      }

      function hasProgress(candidate) {
        return Object.values(candidate).some((item) => item.collected || item.mastered);
      }

      function mergeState(localState, serverState) {
        const next = { ...serverState, ...localState };
        for (const sprite of sprites) {
          const localItem = localState[sprite.id] || {};
          const serverItem = serverState[sprite.id] || {};
          const mastered = Boolean(localItem.mastered || serverItem.mastered);
          next[sprite.id] = {
            collected: Boolean(localItem.collected || serverItem.collected || mastered),
            mastered,
          };
        }
        return next;
      }

      async function hydrateServerState() {
        try {
          const response = await fetch(SERVER_STATE_URL);
          if (!response.ok) throw new Error("State server unavailable");
          serverStateAvailable = true;
          const serverState = normalizeState(await response.json());
          if (hasProgress(serverState)) {
            state = mergeState(state, serverState);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            syncAll();
            if (hasProgress(state)) await persistServerState();
          } else if (hasProgress(state)) {
            await persistServerState();
          }
          status.textContent = "Saved to sprite-state.json.";
        } catch {
          serverStateAvailable = false;
          status.textContent = "Browser storage only. Start the server for file save.";
        }
      }

      async function persistServerState() {
        try {
          const response = await fetch(SERVER_STATE_URL, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(state),
          });
          if (!response.ok) throw new Error("Save failed");
          serverStateAvailable = true;
          status.textContent = "Saved to sprite-state.json.";
        } catch {
          serverStateAvailable = false;
          status.textContent = "Saved in browser. Server file save unavailable.";
        }
      }

      function renderSprites() {
        spriteGrid.innerHTML = "";
        for (const group of groups) {
          spriteGrid.append(renderGroup(group, sprites.filter((sprite) => sprite.group === group)));
        }
        syncAll();
      }

      function renderGroup(group, groupSprites) {
        const row = document.createElement("section");
        const groupSkill = spriteSkills[group] || "";
        row.className = "sprite-row";
        row.dataset.group = group.toLowerCase();
        row.innerHTML = `
          <div class="row-title">
            <div class="row-heading">
              <h2>${group}</h2>
              ${groupSkill ? `<span class="row-skill" title="${groupSkill}">${groupSkill}</span>` : ""}
            </div>
            <span class="row-count">${groupSprites.length} variants</span>
          </div>
          <div class="row-cards"></div>
        `;
        const cards = row.querySelector(".row-cards");
        for (const sprite of groupSprites) {
          const card = document.createElement("article");
          card.className = "sprite-card";
          card.tabIndex = 0;
          card.dataset.id = sprite.id;
          card.dataset.name = `${sprite.name} ${sprite.group} ${sprite.tag} ${sprite.source} ${sprite.rarity} ${sprite.dropRate} ${sprite.availability} ${sprite.variantSkill || ""}`.toLowerCase();
          card.dataset.released = sprite.released ? "true" : "false";
          card.title = [sprite.name, sprite.rarity, sprite.dropRate, sprite.availability, sprite.variantSkill].filter(Boolean).join(" - ");
          const art = `<img class="sprite-image" src="${sprite.image}" alt="${sprite.name}" loading="lazy">`;
          card.innerHTML = `
            <div class="sprite-stage">
              ${art}
            </div>
            <div class="meta">
              <span class="name">${sprite.name}</span>
              <span class="number">#${String(sprite.number).padStart(2, "0")}</span>
              ${sprite.variantSkill ? `<span class="variant-skill" title="${sprite.variantSkill}">${sprite.variantSkill}</span>` : ""}
              ${!sprite.released ? `<span class="availability">Unreleased</span>` : ""}
            </div>
            <div class="toggles">
              <button class="toggle" type="button" data-kind="collected" aria-label="Toggle collected for ${sprite.name}">Have</button>
              <button class="toggle" type="button" data-kind="mastered" aria-label="Toggle mastered for ${sprite.name}">Master</button>
            </div>
          `;
          cards.append(card);
        }
        return row;
      }

      function toggleSprite(id, kind) {
        const item = state[id];
        item[kind] = !item[kind];
        if (kind === "mastered" && item.mastered) {
          item.collected = true;
        }
        if (kind === "collected" && !item.collected) {
          item.mastered = false;
        }
        saveState();
        syncAll();
      }

      function syncAll() {
        let collected = 0;
        let mastered = 0;
        for (const sprite of sprites) {
          const item = state[sprite.id];
          if (sprite.released && item.collected) collected += 1;
          if (sprite.released && item.mastered) mastered += 1;
          const card = spriteGrid.querySelector(`[data-id="${sprite.id}"]`);
          if (!card) continue;
          card.querySelector('[data-kind="collected"]').classList.toggle("on", item.collected);
          card.querySelector('[data-kind="mastered"]').classList.toggle("on", item.mastered);
          card.dataset.collected = item.collected ? "true" : "false";
          card.dataset.mastered = item.mastered ? "true" : "false";
        }
        collectedCount.textContent = `${collected}/${SPRITE_TOTAL}`;
        masteredCount.textContent = `${mastered}/${SPRITE_TOTAL}`;
        applyFilters();
      }

      function applyFilters() {
        const query = search.value.trim().toLowerCase();
        for (const row of spriteGrid.querySelectorAll(".sprite-row")) {
          let visibleCards = 0;
          for (const card of row.querySelectorAll(".sprite-card")) {
            const matchesQuery = !query || card.dataset.name.includes(query);
            const item = state[card.dataset.id];
            const matchesRelease = showUnreleased || card.dataset.released === "true";
            const matchesFilter =
              activeFilter === "all" ||
              (activeFilter === "missing" && !item.collected) ||
              (activeFilter === "collected" && item.collected) ||
              (activeFilter === "mastered" && item.mastered) ||
              (activeFilter === "hide-mastered" && !item.mastered);
            const visible = matchesRelease && matchesQuery && matchesFilter;
            card.classList.toggle("hidden", !visible);
            if (visible) visibleCards += 1;
          }
          row.classList.toggle("hidden", visibleCards === 0);
        }
      }

      spriteGrid.addEventListener("click", (event) => {
        const button = event.target.closest(".toggle");
        if (!button) return;
        const card = button.closest(".sprite-card");
        toggleSprite(card.dataset.id, button.dataset.kind);
      });

      spriteGrid.addEventListener("keydown", (event) => {
        const card = event.target.closest(".sprite-card");
        if (!card) return;
        if (event.key === "c" || event.key === "C") {
          toggleSprite(card.dataset.id, "collected");
        }
        if (event.key === "m" || event.key === "M") {
          toggleSprite(card.dataset.id, "mastered");
        }
      });

      function setActiveFilter(filter, persist = true) {
        activeFilter = validFilters.includes(filter) ? filter : "all";
        document.querySelectorAll("[data-filter]").forEach((item) => {
          item.classList.toggle("active", item.dataset.filter === activeFilter);
        });
        if (persist) localStorage.setItem(FILTER_KEY, activeFilter);
        applyFilters();
      }

      document.querySelectorAll("[data-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          setActiveFilter(button.dataset.filter);
        });
      });

      function setShowUnreleased(next, persist = true) {
        showUnreleased = Boolean(next);
        toggleUnreleased.classList.toggle("active", showUnreleased);
        toggleUnreleased.setAttribute("aria-pressed", showUnreleased ? "true" : "false");
        if (persist) localStorage.setItem(UNRELEASED_KEY, showUnreleased ? "true" : "false");
        applyFilters();
      }

      toggleUnreleased.addEventListener("click", () => {
        setShowUnreleased(!showUnreleased);
      });

      search.addEventListener("input", applyFilters);

      function setSidebarCollapsed(collapsed) {
        document.body.classList.toggle("side-collapsed", collapsed);
        toggleSidebar.setAttribute("aria-label", collapsed ? "Show panel" : "Hide panel");
        toggleSidebar.setAttribute("aria-pressed", collapsed ? "true" : "false");
        localStorage.setItem(SIDEBAR_KEY, collapsed ? "true" : "false");
      }

      toggleSidebar.addEventListener("click", () => {
        setSidebarCollapsed(!document.body.classList.contains("side-collapsed"));
      });

      document.querySelector("#exportData").addEventListener("click", () => {
        dataBox.value = JSON.stringify(state);
        status.textContent = "Exported.";
      });

      document.querySelector("#importData").addEventListener("click", () => {
        try {
          const imported = JSON.parse(dataBox.value);
          state = normalizeState(imported);
          saveState();
          syncAll();
          status.textContent = "Imported.";
        } catch {
          status.textContent = "Import failed.";
        }
      });

      document.querySelector("#resetData").addEventListener("click", () => {
        state = emptyState();
        saveState();
        syncAll();
        dataBox.value = "";
        status.textContent = "Reset.";
      });

      setSidebarCollapsed(localStorage.getItem(SIDEBAR_KEY) === "true");
      setActiveFilter(localStorage.getItem(FILTER_KEY), false);
      setShowUnreleased(showUnreleased, false);
      renderSprites();
      hydrateServerState();
    </script>
